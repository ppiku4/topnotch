# Builds the Windows installer and portable exe, and the macOS (Apple
# Silicon) DMG and ZIP. Pushing a tag like v0.2.0 releases them:
#   draft    creates one draft GitHub Release for the tag
#   windows  builds and uploads its files into that draft
#   mac      builds and uploads its files into that draft
#   publish  publishes the draft and marks it Latest, only after both
# electron-builder only builds (--publish never); gh does all release
# writes, so parallel uploads can never create duplicate releases and the
# in-app update check never sees a half-uploaded one.
name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh finds drafts by tag; create one only if there isn't one yet.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""

  windows:
    needs: draft
    # Still runs (and only builds) on pull requests and manual runs, where
    # the draft job is skipped.
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx vite build

      - name: Package
        run: npx electron-builder --win --publish never

      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*.exe release/*.exe.blockmap release/latest.yml

      - uses: actions/upload-artifact@v7
        with:
          name: topnotch-windows
          path: |
            release/*.exe
            release/latest.yml

  mac:
    needs: draft
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Native helper and Now Playing adapter
        run: bash scripts/build-mac-native.sh

      - name: Build
        run: npx vite build

      # Ad-hoc signed (no Developer ID): users open it the first time with
      # right-click → Open, or System Settings → Privacy & Security.
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --publish never

      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml

      - uses: actions/upload-artifact@v7
        with:
          name: topnotch-mac
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  publish:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

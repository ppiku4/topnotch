# Builds the Windows installer and portable exe, and the macOS (Apple
# Silicon) DMG and ZIP. Pushing a tag like v0.2.0 uploads them to a draft
# GitHub Release, which is published (and marked Latest) only once both
# platforms are up, so the in-app update check never sees a half release.
name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx vite build

      # electron-builder uploads files in parallel and each upload would try
      # to create the release; making sure the draft exists first avoids that.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" --notes ""

      - name: Package (publish on tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win ${{ startsWith(github.ref, 'refs/tags/v') && '--publish always' || '--publish never' }}

      - uses: actions/upload-artifact@v7
        with:
          name: topnotch-windows
          path: |
            release/*.exe
            release/latest.yml

  # Runs after Windows so both don't race to create the same release.
  mac:
    needs: windows
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Native helper and Now Playing adapter
        run: bash scripts/build-mac-native.sh

      - name: Build
        run: npx vite build

      # electron-builder uploads files in parallel and each upload would try
      # to create the release; making sure the draft exists first avoids that.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" --notes ""

      # Ad-hoc signed (no Developer ID): users open it the first time with
      # right-click → Open, or System Settings → Privacy & Security.
      - name: Package (publish on tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 ${{ startsWith(github.ref, 'refs/tags/v') && '--publish always' || '--publish never' }}

      - uses: actions/upload-artifact@v7
        with:
          name: topnotch-mac
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  # Both platforms uploaded: publish the draft and make it the latest release.
  publish:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
